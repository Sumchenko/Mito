<!-- Email confirmation after sign-up. The URL points at Mito's own domain. -->
<div style="font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; color: #1f2937">
  <h2 style="font-weight: 600">Добро пожаловать в Mito</h2>
  <p>Подтвердите почту, чтобы задачи и время синхронизировались между вашими устройствами.</p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; padding: 10px 18px; border-radius: 6px; background: #2c6a86; color: #fff; text-decoration: none">Подтвердить почту</a>
  </p>
  <p style="color: #6b7280; font-size: 13px">Welcome to Mito — confirm your email with the button above. If you did not sign up, ignore this email.</p>
</div>
