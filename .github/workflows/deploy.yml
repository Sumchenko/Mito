# Every push to main: check → migrate the database → build and publish the site.
# Nothing is published unless types, lint and tests pass. Setup: docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of cancelling a half-finished one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  migrate:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply new migrations
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.MITO_DOMAIN }}
    env:
      HOST: ${{ vars.SERVER_HOST }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The app talks to Supabase through our own domain (see deploy/Caddyfile).
          VITE_SUPABASE_URL: https://${{ vars.MITO_DOMAIN }}/sb
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: SSH access
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Render web server config
        run: |
          sed -e "s#__MITO_DOMAIN__#${{ vars.MITO_DOMAIN }}#g" \
              -e "s#__SUPABASE_URL__#${{ vars.SUPABASE_URL }}#g" \
              deploy/Caddyfile > Caddyfile.rendered

      - name: Upload release
        run: |
          rsync -az --delete dist/ "deploy@$HOST:/var/www/mito/releases/$RELEASE/"
          scp Caddyfile.rendered "deploy@$HOST:/tmp/Caddyfile.mito"

      # Validate the new config before touching the live one; switch the site atomically by
      # moving the `current` symlink; keep the last five releases for a quick rollback.
      - name: Activate
        run: |
          ssh "deploy@$HOST" bash -se <<EOF
          set -euo pipefail
          caddy validate --config /tmp/Caddyfile.mito --adapter caddyfile
          cat /tmp/Caddyfile.mito > /etc/caddy/Caddyfile
          ln -sfn "/var/www/mito/releases/$RELEASE" /var/www/mito/current.next
          mv -T /var/www/mito/current.next /var/www/mito/current
          sudo systemctl reload caddy
          cd /var/www/mito/releases && ls -1t | tail -n +6 | xargs -r rm -rf
          EOF

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://${{ vars.MITO_DOMAIN }}/" | grep -q '<div id="root">'
          curl -fsS -o /dev/null "https://${{ vars.MITO_DOMAIN }}/sb/auth/v1/health" -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}"
