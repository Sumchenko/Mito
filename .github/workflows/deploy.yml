# Every push to main: check → migrate the database → build and publish the site.
# Nothing is published unless types, lint and tests pass. Setup: docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of cancelling a half-finished one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  migrate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Straight to Postgres with the connection string: no Supabase account token needed.
      # Already-applied migrations are skipped, so this is a no-op most of the time.
      - name: Apply new migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.MITO_DOMAIN }}
    env:
      HOST: ${{ vars.SERVER_HOST }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The app talks to Supabase through our own domain (see deploy/Caddyfile).
          VITE_SUPABASE_URL: https://${{ vars.MITO_DOMAIN }}/sb
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: SSH access
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Render web server config
        run: |
          # Only scheme and host: tolerate a pasted REST URL (…supabase.co/rest/v1) or a trailing slash.
          SUPABASE_ORIGIN=$(echo "${{ vars.SUPABASE_URL }}" | sed -E 's#^(https?://[^/]+).*#\1#')
          sed -e "s#__MITO_DOMAIN__#${{ vars.MITO_DOMAIN }}#g" \
              -e "s#__SUPABASE_URL__#${SUPABASE_ORIGIN}#g" \
              deploy/Caddyfile > Caddyfile.rendered

      - name: Upload release
        run: |
          rsync -az --delete dist/ "deploy@$HOST:/var/www/mito/releases/$RELEASE/"
          scp Caddyfile.rendered "deploy@$HOST:/tmp/Caddyfile.mito"

      # Validate the new config before touching the live one; switch the site atomically by
      # moving the `current` symlink; keep the last five releases for a quick rollback.
      - name: Activate
        run: |
          ssh "deploy@$HOST" bash -se <<EOF
          set -euo pipefail
          caddy validate --config /tmp/Caddyfile.mito --adapter caddyfile
          cat /tmp/Caddyfile.mito > /etc/caddy/Caddyfile
          ln -sfn "/var/www/mito/releases/$RELEASE" /var/www/mito/current.next
          mv -T /var/www/mito/current.next /var/www/mito/current
          sudo systemctl reload caddy
          cd /var/www/mito/releases && ls -1t | tail -n +6 | xargs -r rm -rf
          EOF

      # The AI mentor service (server/mentor), run by Node straight from TypeScript. Skipped with a
      # warning until the server has the service (re-run deploy/setup-server.sh once).
      - name: Mentor service
        env:
          GEMINI: ${{ secrets.MENTOR_GEMINI_KEY }}
          GROQ: ${{ secrets.MENTOR_GROQ_KEY }}
          SALT: ${{ secrets.MENTOR_SALT }}
        run: |
          if ! ssh "deploy@$HOST" 'test -f /etc/systemd/system/mito-mentor.service'; then
            echo "::warning::The mentor service is not installed on the server yet: re-run deploy/setup-server.sh"
            exit 0
          fi
          rsync -azR --delete --exclude '*.test.ts' server/mentor/ src/mentor/protocol.ts "deploy@$HOST:/opt/mito-mentor/"
          printf 'MENTOR_GEMINI_KEY=%s\nMENTOR_GROQ_KEY=%s\nMENTOR_SALT=%s\n' "$GEMINI" "$GROQ" "${SALT:-$GITHUB_REPOSITORY_ID}" \
            | ssh "deploy@$HOST" 'cat > /etc/mito/mentor.env'
          ssh "deploy@$HOST" 'sudo systemctl restart mito-mentor'
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "https://${{ vars.MITO_DOMAIN }}/api/mentor/health"

      # Retries cover the first deploy on a new domain, while Caddy is still obtaining the certificate.
      - name: Smoke test
        run: |
          get() { curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$@"; }
          get "https://${{ vars.MITO_DOMAIN }}/" | grep -q '<div id="root">'
          get -o /dev/null "https://${{ vars.MITO_DOMAIN }}/sb/auth/v1/health" -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}"
